sonar.projectKey=g3-swp391-2hand-ev-battery-trading
sonar.projectName=EV Battery Trading
sonar.projectVersion=1.0

sonar.host.url=https://sonarcloud.io
sonar.organization=YOUR_ORG_KEY
# SONAR_TOKEN will be passed via environment variable

# Phân tích code trong apps (web/api) và packages
sonar.sources=apps,packages

# Vị trí test (để sau này Sonar nhận diện test files đúng hơn)
sonar.tests=apps/**/__tests__/**,apps/**/*.spec.ts,apps/**/*.test.ts,apps/**/*.spec.tsx,apps/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/build/**,**/out/**,apps/db/**,testsprite_tests/**,k6/**,ai-prompt/**,.husky/**,docs/**

sonar.sourceEncoding=UTF-8

# TypeScript configuration
sonar.javascript.tsconfigPath=apps/api/tsconfig.json,apps/web/tsconfig.json

